<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#070b19" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5" />
  <!-- Bus Body -->
  <g filter="url(#glow)">
    <rect x="14" y="14" width="36" height="34" rx="8" fill="url(#busGrad)" />
    <!-- Windshield -->
    <rect x="18" y="18" width="28" height="12" rx="3" fill="#070b19" fill-opacity="0.85" />
    <!-- Route sign -->
    <rect x="22" y="15" width="20" height="2" rx="1" fill="#ffffff" fill-opacity="0.9" />
    <!-- Headlights -->
    <circle cx="20" cy="38" r="2.5" fill="#ffffff" />
    <circle cx="44" cy="38" r="2.5" fill="#ffffff" />
    <!-- Grille -->
    <rect x="26" y="37" width="12" height="2" rx="1" fill="#070b19" fill-opacity="0.6" />
    <!-- Wheels -->
    <rect x="18" y="48" width="7" height="4" rx="2" fill="#64748b" />
    <rect x="39" y="48" width="7" height="4" rx="2" fill="#64748b" />
    <!-- Live Beacon -->
    <circle cx="46" cy="14" r="3" fill="#10b981" />
  </g>
</svg>